name: Build APK e Web

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter project scaffold
        run: |
          mkdir -p /tmp/scaffold
          flutter create --platforms=android --org com.soundstream /tmp/scaffold/app
          cp -f pubspec.yaml /tmp/scaffold/app/pubspec.yaml
          cp -f lib/main.dart /tmp/scaffold/app/lib/main.dart
          cp -rf /tmp/scaffold/app/. .
          rm -rf /tmp/scaffold

      - name: Add required permissions to AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          echo "--- Manifest PRIMA della patch ---"
          cat "$MANIFEST"

          # Aggancio al token "<application" (sempre presente, indipendentemente
          # da come Flutter formatta la riga di apertura <manifest ...>), così
          # la patch funziona anche se cambia la versione di Flutter/template.
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' "$MANIFEST"

          echo "--- Manifest DOPO la patch ---"
          cat "$MANIFEST"

          # Verifica esplicita: se il permesso INTERNET non è presente,
          # la build si ferma qui con un errore chiaro invece di produrre
          # un APK che compila ma non riesce a fare richieste di rete.
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "::error::Permesso INTERNET non presente nel Manifest dopo la patch. Build interrotta."
            exit 1
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: soundstream-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter project scaffold (web)
        run: |
          mkdir -p /tmp/scaffold
          flutter create --platforms=web --org com.soundstream /tmp/scaffold/app
          cp -f pubspec.yaml /tmp/scaffold/app/pubspec.yaml
          cp -f lib/main.dart /tmp/scaffold/app/lib/main.dart
          cp -rf /tmp/scaffold/app/. .
          rm -rf /tmp/scaffold

      - name: Get dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --base-href /${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: acti
        ons/deploy-pages@v4

name: Build APK e Web

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter project scaffold
        run: |
          mkdir -p /tmp/scaffold
          flutter create --platforms=android --org com.soundstream /tmp/scaffold/app
          cp -f pubspec.yaml /tmp/scaffold/app/pubspec.yaml
          cp -f lib/main.dart /tmp/scaffold/app/lib/main.dart
          cp -rf /tmp/scaffold/app/. .
          rm -rf /tmp/scaffold

      - name: Add required permissions to AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>#' "$MANIFEST"
          cat "$MANIFEST"

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: soundstream-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter project scaffold (web)
        run: |
          mkdir -p /tmp/scaffold
          flutter create --platforms=web --org com.soundstream /tmp/scaffold/app
          cp -f pubspec.yaml /tmp/scaffold/app/pubspec.yaml
          cp -f lib/main.dart /tmp/scaffold/app/lib/main.dart
          cp -rf /tmp/scaffold/app/. .
          rm -rf /tmp/scaffold

      - name: Get dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --base-href /${{ github.event.repository.name }}/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
